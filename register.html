<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 440px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 6px; }
        p.sub { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.92rem; color: #1e293b; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.95rem; }
        button { width: 100%; background: #10b981; color: #fff; border: none; padding: 11px; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
        button:hover { background: #059669; }
        .links { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .links a { color: #1e3a8a; text-decoration: none; font-weight: 600; margin: 0 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Student Registration</h2>
    <p class="sub">Register to track expenses and manage budgets</p>

    <form action="register.php" method="POST" onsubmit="return validateReg()">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" placeholder="e.g., ST2026001" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@university.edu" required>
        </div>
        <div class="form-group">
            <label for="password">Password (min 6 chars)</label>
            <input type="password" id="password" name="password" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" minlength="6" required>
        </div>
        <button type="submit">Register</button>
    </form>

    <div class="links">
        <a href="index.html#login">Login</a> | <a href="index.html">Home</a>
    </div>
</div>

<script>
function validateReg() {
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("confirm_password").value;
    if (p1 !== p2) {
        alert("Password and Confirm Password must match!");
        return false;
    }
    return true;
}
</script>
</body>
</html>
